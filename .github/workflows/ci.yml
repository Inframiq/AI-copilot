name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Web (typecheck + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        working-directory: apps/web
        run: npx tsc --noEmit

      - name: Test
        working-directory: apps/web
        run: npm test

      - name: Dependency audit
        run: npm audit --omit=dev

  api:
    name: API (test)
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://ci-placeholder.supabase.co
      SUPABASE_ANON_KEY: ci-placeholder
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
      SUPABASE_JWT_SECRET: ci-placeholder-secret-at-least-32-chars-long
      DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/ci_placeholder
      AI_PROVIDER: gemini
      GEMINI_API_KEY: ci-placeholder
      OPENAI_API_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/requirements*.txt

      - name: Install dependencies
        working-directory: apps/api
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Test
        working-directory: apps/api
        run: pytest -q

      - name: Dependency audit
        working-directory: apps/api
        # Informational for now: pypdf/weasyprint/starlette have known CVEs
        # pending a coordinated, tested major-version upgrade (tracked
        # separately). Flip to blocking once that upgrade lands.
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt
