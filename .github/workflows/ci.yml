name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Web (typecheck + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        working-directory: apps/web
        run: npx tsc --noEmit

      - name: Test
        working-directory: apps/web
        run: npm test

      - name: Dependency audit
        run: npm audit --omit=dev

  api:
    name: API (test)
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://ci-placeholder.supabase.co
      SUPABASE_ANON_KEY: ci-placeholder
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
      SUPABASE_JWT_SECRET: ci-placeholder-secret-at-least-32-chars-long
      DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/ci_placeholder
      AI_PROVIDER: gemini
      GEMINI_API_KEY: ci-placeholder
      OPENAI_API_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/requirements*.txt

      - name: Install dependencies
        working-directory: apps/api
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Test
        working-directory: apps/api
        run: pytest -q

      - name: Dependency audit
        working-directory: apps/api
        # Blocking, with two accepted/tracked exceptions:
        #   PYSEC-2026-3412 (weasyprint) — no fix version published yet.
        #   PYSEC-2026-1805 (protobuf)   — fix requires protobuf>=5.0, which
        #     google-ai-generativelanguage (pulled in by google-generativeai
        #     0.7.2) hard-pins below; needs a coordinated google-generativeai
        #     upgrade, tracked separately.
        # Any other new finding fails the build.
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --ignore-vuln PYSEC-2026-3412 --ignore-vuln PYSEC-2026-1805
