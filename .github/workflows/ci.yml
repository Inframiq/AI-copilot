name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Web (typecheck + test)
    # Pinned, not ubuntu-latest: the label moves to a new image on its own
    # schedule, which is a change to CI nobody chose.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Supabase, jest-dom and others declare node >=22; 20 warned on install.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        working-directory: apps/web
        run: npx tsc --noEmit

      - name: Test
        working-directory: apps/web
        run: npm test

      - name: Dependency audit
        run: npm audit --omit=dev

  api:
    name: API (test)
    runs-on: ubuntu-26.04
    env:
      SUPABASE_URL: https://ci-placeholder.supabase.co
      SUPABASE_ANON_KEY: ci-placeholder
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
      SUPABASE_JWT_SECRET: ci-placeholder-secret-at-least-32-chars-long
      DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/ci_placeholder
      OPENAI_API_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/requirements*.txt

      - name: Install dependencies
        working-directory: apps/api
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Test
        working-directory: apps/api
        run: pytest -q

      - name: Dependency audit
        working-directory: apps/api
        # Blocking, no exceptions. (protobuf's PYSEC-2026-1805 was ignored
        # here while google-generativeai pinned it; that package went with
        # the Gemini provider, and nothing else installs protobuf.)
        # (weasyprint PYSEC-2026-3412 / PYSEC-2026-3940 are both fixed in 70.0,
        #  which requirements.txt now pins — no ignore needed.)
        # Any other new finding fails the build.
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt
