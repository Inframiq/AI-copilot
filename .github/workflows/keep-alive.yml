name: Keep API alive

# Render's free tier spins the API down after ~15 min of inactivity, and the
# first request after that can take 50+ seconds to wake it back up — long
# enough that the browser gives up and reports a bare "failed to fetch".
# Pinging /health well inside that window keeps the service warm.
#
# It is also the site's alarm (test INF-004): a failed run emails the repo
# owner, so each check below fails the run when the live site stops doing
# what it should — the API or the website down, or the API answering
# requests that should be refused.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-26.04
    steps:
      - name: Ping API health endpoint
        # Cold starts on Render's free tier take 50+ seconds, so allow a long
        # per-attempt timeout and retry a few times before giving up.
        run: >
          curl -sf --show-error
          --connect-timeout 15
          --max-time 120
          --retry 3
          --retry-delay 30
          --retry-all-errors
          https://ai-copilot-asxm.onrender.com/health

      - name: Website answers
        run: >
          curl -sf --show-error -o /dev/null
          --connect-timeout 15
          --max-time 60
          --retry 3
          --retry-delay 30
          --retry-all-errors
          https://kripax.inframiq.com/login

      - name: API still refuses what it should
        # Not signed in: no data, no admin pages, no API docs.
        run: |
          check() {
            got=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "$2")
            if [ "$got" != "$1" ]; then
              echo "::error::$2 answered $got, expected $1"
              return 1
            fi
            echo "$2 -> $got"
          }
          check 401 https://ai-copilot-asxm.onrender.com/resumes
          check 401 https://ai-copilot-asxm.onrender.com/admin/users
          check 404 https://ai-copilot-asxm.onrender.com/docs
          check 404 https://ai-copilot-asxm.onrender.com/openapi.json
