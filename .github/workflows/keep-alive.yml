name: Keep API alive

# Render's free tier spins the API down after ~15 min of inactivity, and the
# first request after that can take 50+ seconds to wake it back up — long
# enough that the browser gives up and reports a bare "failed to fetch".
# Pinging /health well inside that window keeps the service warm.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API health endpoint
        # Cold starts on Render's free tier take 50+ seconds, so allow a long
        # per-attempt timeout and retry a few times before giving up.
        run: >
          curl -sf --show-error
          --connect-timeout 15
          --max-time 120
          --retry 3
          --retry-delay 30
          --retry-all-errors
          https://ai-copilot-asxm.onrender.com/health
